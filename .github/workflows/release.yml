name: Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.agents/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag override (optional, e.g. v3.3.0)'
        required: false
        default: ''
        type: string
      title:
        description: 'Release title'
        required: false
        type: string
      description:
        description: 'Release description / notes'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      pkg_version: ${{ steps.version.outputs.pkg_version }}
      bumped: ${{ steps.version.outputs.bumped }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Resolve Release Version
        id: version
        run: |
          python scripts/release_tag.py "${{ inputs.tag }}" --ci >> $GITHUB_OUTPUT
          echo "title=${{ inputs.title || '' }}" >> $GITHUB_OUTPUT

      - name: Commit Version Bump
        if: steps.version.outputs.bumped == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/package.json frontend/package.json backend/src/services/versionService.js docker-compose.yml README.md
          git commit -m "chore(release): bump version to ${{ steps.version.outputs.tag }} [skip ci]" || true
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin main "${{ steps.version.outputs.tag }}" || true

      - name: Update latest tag pointer
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f latest ${{ github.sha }}
          git push -f origin latest || true

      - name: Generate Dynamic Release Notes
        run: |
          python scripts/release_notes.py --tag "${{ steps.version.outputs.tag }}" --desc "${{ inputs.description || '' }}" --out dist/release_notes.md

      - name: Publish GitHub Release
        if: steps.version.outputs.bumped == 'true' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.title || format('GitHub Runner Manager {0}', steps.version.outputs.tag) }}
          body_path: dist/release_notes.md
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: release
    if: needs.release.outputs.bumped == 'true' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
