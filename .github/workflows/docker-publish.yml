name: Build, Push & Sync to Docker Hub

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.1.0)'
        required: false
        type: string
      title:
        description: 'Release title (defaults to tag)'
        required: false
        type: string
      description:
        description: 'Release description / notes'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve Release Version
        id: version
        run: |
          python scripts/release_tag.py "${{ inputs.tag }}" --ci >> $GITHUB_OUTPUT
          echo "title=${{ inputs.title || '' }}" >> $GITHUB_OUTPUT

      - name: Commit Version Bump
        if: steps.version.outputs.bumped == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/package.json frontend/package.json backend/src/services/versionService.js docker-compose.yml README.md
          git commit -m "chore(release): bump version to ${{ steps.version.outputs.tag }} [skip ci]" || true
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin main "${{ steps.version.outputs.tag }}" || true

      - name: Update latest tag pointer
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f latest ${{ github.sha }}
          git push -f origin latest || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'kerklangsi' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            kerklangsi/github-runner
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.tag }},enable=${{ steps.version.outputs.tag != '' }}
            type=raw,value=${{ steps.version.outputs.pkg_version }},enable=${{ steps.version.outputs.pkg_version != '' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync README to Docker Hub
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'kerklangsi' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: kerklangsi/github-runner

      - name: Generate Dynamic Release Notes
        run: |
          python scripts/release_notes.py --tag "${{ steps.version.outputs.tag }}" --desc "${{ inputs.description || '' }}" --out dist/release_notes.md

      - name: Create or Update GitHub Release
        if: steps.version.outputs.bumped == 'true' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.title || format('GitHub Runner Manager {0}', steps.version.outputs.tag) }}
          body_path: dist/release_notes.md
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

