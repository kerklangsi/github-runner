name: Docker Publish

on:
  workflow_call:
    inputs:
      tag:
        description: 'Docker image tag'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (e.g. v3.2.1)'
        required: false
        type: string
        default: ''
  push:
    tags: [ 'v*.*.*' ]
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: Determine Docker Tag
        id: tag_info
        run: |
          RAW_TAG="${{ inputs.tag || github.event.release.tag_name || github.ref_name || '' }}"
          if [ -z "$RAW_TAG" ] || [ "$RAW_TAG" = "main" ]; then
            PKG_VER=$(jq -r .version backend/package.json 2>/dev/null || echo "latest")
            RAW_TAG="v${PKG_VER}"
          fi
          CLEAN_VER="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> $GITHUB_OUTPUT
          echo "version=${CLEAN_VER}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'kerklangsi' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            kerklangsi/github-runner
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.tag_info.outputs.tag }}
            type=raw,value=${{ steps.tag_info.outputs.version }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync README to Docker Hub
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'kerklangsi' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: kerklangsi/github-runner
